[workspace]
members = ["crates/tos-core", "crates/tos-cli", "crates/tos-wasm"]
resolver = "2"

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "MIT"

[workspace.dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tos-core = { path = "crates/tos-core" }

[profile.release]
lto = true
codegen-units = 1
opt-level = "s"
strip = true
